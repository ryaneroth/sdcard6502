# ld65 configuration for the example programs: code for a 2864 EEPROM at
# $A000, variables in low RAM.  $0200-$03FF is the sector cache
# (fat32_workspace in each example).
MEMORY {
    ZP:  file = "", start = $0040, size = $0040;
    RAM: file = "", start = $0400, size = $0400;
    ROM: file = %O, start = $A000, size = $2000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro, optional = yes;
    BSS:      load = RAM, type = bss;
}
